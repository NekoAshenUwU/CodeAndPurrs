# Initial HTTP-only site. No requests are proxied to the private MCP service.
server {
    listen 80;
    server_name wake-mcp.nekopurrs.uk;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/neko-native-wake-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Neko Native Wake: setup pending.\n";
    }
}
